name: image_thumb
version: 1.0.0
description: 生成缩略图并落盘到 var/capability_probe
entry: skill.py:run
triggers:
  intents: []
  keywords:
  - 缩略图
  - 图片
  regex: []
  require_all: false
inputs:
  type: object
  required: []
  properties:
    path:
      type: string
      description: 参数 path
    width:
      type: integer
    height:
      type: integer
dependencies:
  tools: []
permissions: write
timeout_seconds: 30
category: 文档与文件
color: '#d97706'
sample_args:
  path: samples/sample.png
  width: 64
  height: 64
origin: local
