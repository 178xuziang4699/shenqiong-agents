name: text_diff
version: 1.0.0
description: 生成两段文本的 unified diff 与相似度
entry: skill.py:run
triggers:
  intents: []
  keywords:
  - 差异
  - 比对
  - diff
  regex: []
  require_all: false
inputs:
  type: object
  required: []
  properties:
    left:
      type: string
      description: 参数 left
    right:
      type: string
      description: 参数 right
dependencies:
  tools: []
permissions: read
timeout_seconds: 30
category: 文本处理
color: '#2563eb'
sample_args:
  left: '第一行

    第二行

    第三行'
  right: '第一行

    第二行改了

    第三行'
origin: local
