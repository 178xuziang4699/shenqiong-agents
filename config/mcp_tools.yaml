# ============================================================
# MCP 工具注册表（统一入口）
# transport: stdio  → 真实 MCP 子进程（JSON-RPC 2.0 / newline 分帧）
# transport: local  → 进程内工具（知识库等内部能力），仍走同一套
#                     校验 / 权限 / 审计链路，业务代码不直连
# permission: read | write | dangerous
#   write / dangerous 属于"关键写操作"，执行前必须输出动作并等待确认
# ============================================================

servers:
  - name: fs
    transport: stdio
    command: ["python", "-u", "-m", "app.tools.servers.fs_server"]
    cwd: "."
    env:
      AP_WORKSPACE: "${AP_WORKSPACE:-.}"
  - name: calc
    transport: stdio
    command: ["python", "-u", "-m", "app.tools.servers.calc_server"]
    cwd: "."
  - name: util
    transport: stdio
    command: ["python", "-u", "-m", "app.tools.servers.util_server"]
    cwd: "."

tools:
  - name: fs.list_dir
    server: fs
    remote_name: list_dir
    permission: read
    timeout_seconds: 10
    description: 列出目录下的文件与大小
    input_schema:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 相对工作区根目录的路径

  - name: fs.read_text
    server: fs
    remote_name: read_text
    permission: read
    timeout_seconds: 10
    description: 读取文本文件内容
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
        max_chars: {type: integer, minimum: 1, maximum: 200000}

  - name: fs.write_text
    server: fs
    remote_name: write_text
    permission: write
    timeout_seconds: 10
    description: 写入文本文件（关键写操作，需人工确认）
    input_schema:
      type: object
      required: [path, content]
      properties:
        path: {type: string}
        content: {type: string}
        overwrite: {type: boolean}

  - name: calc.word_count
    server: calc
    remote_name: word_count
    permission: read
    timeout_seconds: 10
    description: 统计文本字数（中英文混合）
    input_schema:
      type: object
      required: [text]
      properties:
        text: {type: string}

  - name: calc.eval
    server: calc
    remote_name: eval
    permission: read
    timeout_seconds: 5
    description: 计算算术表达式（仅四则运算与括号）
    input_schema:
      type: object
      required: [expression]
      properties:
        expression: {type: string, pattern: "^[0-9+\\-*/(). ]+$"}

  - name: kb.search
    server: kb
    transport: local
    local_handler: "app.knowledge.retriever:search_tool"
    permission: read
    timeout_seconds: 15
    description: 知识库检索召回（返回结果带来源引用）
    input_schema:
      type: object
      required: [query]
      properties:
        query: {type: string}
        top_k: {type: integer, minimum: 1, maximum: 20}

  - name: kb.ingest
    server: kb
    transport: local
    local_handler: "app.knowledge.ingest:ingest_tool"
    permission: write
    timeout_seconds: 60
    description: 文档入库：切分 → 向量化 → 落库（关键写操作，需人工确认）
    input_schema:
      type: object
      required: [path]
      properties:
        path: {type: string}
        title: {type: string}

  - name: util.text_summarize
    server: util
    remote_name: text_summarize
    permission: read
    timeout_seconds: 20
    description: 按句子信息密度抽取要点摘要
    input_schema:
      type: object
      required: []
      properties:
        text: {type: string}
        max_points: {type: integer}

  - name: util.text_wordcount
