<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Platform · 管理后台</title>
<style>
:root{
  --bg:#f5f7fa; --card:#fff; --line:#e6e9ef; --text:#1f2329; --sub:#6b7280;
  --brand:#2f6bff; --brand-soft:#eef3ff; --ok:#16a34a; --warn:#d97706;
  --err:#dc2626; --side:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input,select,textarea{font:inherit}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#eef3ff,#f7f9fc);
  display:flex;align-items:center;justify-content:center;z-index:100}
#login .box{background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:32px;width:min(420px,90vw);box-shadow:0 12px 40px rgba(31,35,41,.08)}
#login h1{font-size:20px;margin:0 0 6px}
#login p{color:var(--sub);font-size:13px;margin:0 0 20px}
#login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:12px}
#login button{width:100%;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
#login .tip{font-size:12px;color:var(--sub);margin-top:14px;line-height:1.7}
#app{display:none;height:100vh;grid-template-columns:244px 1fr;grid-template-rows:56px 1fr}
#app.on{display:grid}
header{grid-column:1/3;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;z-index:5}
header .logo{font-weight:700;font-size:16px}
header .badge{font-size:11px;background:var(--brand-soft);color:var(--brand);
  padding:2px 9px;border-radius:999px}
header .sp{flex:1}
header .role{font-size:12px;color:var(--sub)}
header a{color:var(--brand);text-decoration:none;font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.live i{width:7px;height:7px;border-radius:50%;background:#cbd5e1;display:inline-block}
.live.on i{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
aside{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:10px 0}
.grp{margin-bottom:2px}
.grp>.t{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;
  font-weight:600;font-size:13px;user-select:none}
.grp>.t:hover{background:#f7f9fc}
.grp>.t .ic{width:20px;text-align:center;color:var(--brand)}
.grp>.t .ar{margin-left:auto;color:#9ca3af;font-size:11px;transition:transform .15s}
.grp.open>.t .ar{transform:rotate(90deg)}
.grp .sub{display:none;padding:2px 0 6px}
.grp.open .sub{display:block}
.grp .sub button{display:block;width:100%;text-align:left;border:0;background:none;
  padding:7px 16px 7px 45px;color:var(--sub);font-size:12.5px;cursor:pointer}
.grp .sub button:hover{color:var(--brand);background:#f7f9fc}
.grp .sub button.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
main{overflow:auto;padding:20px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 4px}
.card .hint{color:var(--sub);font-size:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;line-height:1.3}
.kpi span{color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;background:#fafbfc;white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:#eef2ff;color:#3730a3}
.tag.ok{background:#dcfce7;color:#15803d}
.tag.err{background:#fee2e2;color:#b91c1c}
.tag.warn{background:#fef3c7;color:#92400e}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--text)}
button.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer}
button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
button.btn:hover{filter:brightness(.97)}
pre{white-space:pre-wrap;word-break:break-all;background:#f8f9fb;border:1px solid var(--line);
  border-radius:8px;padding:12px;max-height:380px;overflow:auto;font-size:12px}
.empty{color:var(--sub);text-align:center;padding:26px 0}
.note{background:#f8faff;border:1px solid #dbe6ff;border-radius:9px;padding:11px 13px;
  font-size:12.5px;color:#334155;margin-bottom:14px}
.note.err{background:#fff5f5;border-color:#fecaca;color:#991b1b}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.kv div{background:#fafbfd;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px}
.kv b{color:var(--sub);font-weight:600}
#feed{font-family:ui-monospace,monospace;font-size:11.5px;max-height:420px;overflow:auto}
#feed .row{padding:5px 8px;border-bottom:1px solid #f0f2f6;display:flex;gap:9px}
#feed .row .t{color:#9ca3af;white-space:nowrap}
#feed .row .k{color:var(--brand);min-width:96px}
#feed .row .s{flex:1;word-break:break-all}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{display:none}main{padding:14px}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>Agent Platform</h1>
    <p>智能体 Agent · 独立管理后台（第二阶段）</p>
    <input id="tok" type="password" placeholder="请输入访问令牌" autocomplete="off">
    <button onclick="doLogin()">进入管理后台</button>
    <div class="tip">
      超管令牌：<span class="mono" id="hint-admin">AP_ADMIN_TOKEN</span><br>
      只读令牌：<span class="mono" id="hint-view">AP_ADMIN_VIEW_TOKEN</span><br>
      令牌由部署脚本生成并保存在 <span class="mono">var/admin_token.txt</span>（权限 600）。
    </div>
    <div class="tip err" id="login-err" style="display:none"></div>
  </div>
</div>

<div id="app">
  <header>
    <span class="logo">🤖 Agent Platform</span>
    <span class="badge">Agent Platform 管理后台</span>
    <span class="sp"></span>
    <span class="live" id="live"><i></i><span>实时连接中…</span></span>
    <span class="role" id="role"></span>
    <a href="/" target="_blank">平台首页 ↗</a>
  </header>
  <aside id="nav"></aside>
  <main><div id="view"><div class="empty">正在加载总览…</div></div></main>
</div>

<script>
// ---- 路径前缀：兼容「独立进程 /」与「挂载 /console/」两种形态 ----
const P = location.pathname.replace(/\/+$/,'');
const API = (p) => `${P}/api/admin/${p}`;
let TOKEN = '';   // 每次打开页面都必须手动输入令牌，不做本地持久化恢复
let ROLE = '';

async function api(p, opt={}) {
  const r = await fetch(API(p), { ...opt, headers: {
    'X-Admin-Token': TOKEN, 'Content-Type':'application/json', ...(opt.headers||{}) }});
  if (r.status === 401) { logout('令牌失效，请重新登录'); throw new Error('401'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) { const e = new Error(d.message || d.error || ('HTTP '+r.status));
               e.payload = d; throw e; }
  return d;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tbl(cols, rows){ return `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
  <tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):
  `<tr><td colspan="${cols.length}" class="empty">暂无数据</td></tr>`}</tbody></table>`; }
function tag(s){ const ok=['ok','done','completed','resolved','pass'].includes(String(s).toLowerCase());
  const bad=['failed','error','interrupted','open','denied','rejected'].includes(String(s).toLowerCase());
  return `<span class="tag ${ok?'ok':bad?'err':'warn'}">${esc(s)}</span>`; }
function fmtTime(t){ return String(t||'').replace('T',' ').slice(0,19); }

async function doLogin(){
  const t = document.getElementById('tok').value.trim();
  if(!t) return;
  try{
    const d = await fetch(API('login'), {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:t})}).then(r=>r.json());
    if(!d.ok){ throw new Error(d.message||'令牌无效'); }
    TOKEN = t; ROLE = d.role;
    enter();
  }catch(e){ const el=document.getElementById('login-err'); el.style.display='block'; el.textContent=e.message; }
}
function logout(msg){
  TOKEN = ''; ROLE = '';
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display='flex';
  if(msg){ const el=document.getElementById('login-err'); el.style.display='block'; el.textContent=msg; }
}
function enter(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('role').textContent = ROLE==='admin'?'● 超管':'● 只读';
  buildNav(); openMenu('overview','ov-health'); startStream();
}

// ---- 主菜单 → 子菜单（与结构框架文档严格对应） ----
let MENU = [
  {id:'overview', icon:'📊', t:'0. 总览驾驶舱', sub:[
    ['ov-health','0.1 平台健康总览'],['ov-metrics','0.2 实时指标'],
    ['ov-sync','0.3 数据同步状态'],['ov-topo','0.4 服务拓扑']]},
  {id:'tasks', icon:'📋', t:'1. 任务与作业', sub:[
    ['tk-list','1.1 会话列表'],['tk-chain','1.2 任务执行链'],
    ['tk-flow','1.3 作业流转图'],['tk-replay','1.4 快照与上下文回放']]},
  {id:'diag', icon:'🩺', t:'2. 诊断与恢复', sub:[
    ['dg-one','2.1 一键诊断'],['dg-resume','2.2 断点恢复'],['dg-inject','2.3 故障注入']]},
  {id:'errors', icon:'🚨', t:'3. 错误代码核查', sub:[
    ['er-lookup','3.1 错误代码查询'],['er-list','3.2 事故列表'],
    ['er-evidence','3.3 关联证据串联'],['er-resolve','3.4 处置与标注']]},
  {id:'events', icon:'⚡', t:'4. 实时事件流', sub:[
    ['ev-stream','4.1 事件订阅'],['ev-search','4.2 事件检索'],['ev-check','4.3 一致性对账']]},
  {id:'agents', icon:'🤖', t:'5. 智能体与编排', sub:[
    ['ag-list','5.1 Agent 注册与角色'],['ag-route','5.2 分派与路由配置'],['ag-policy','5.3 工作流与策略']]},
  {id:'catalog', icon:'🧰', t:'6. 工具与技能', sub:[
    ['ct-tools','6.1 工具注册表'],['ct-skills','6.2 技能目录'],['ct-mcp','6.3 MCP 连接器']]},
  {id:'kb', icon:'📚', t:'7. 资料库与知识', sub:[
    ['kb-docs','7.1 文档索引'],['kb-hit','7.2 检索命中']]},
  {id:'security', icon:'🔐', t:'8. 安全与访问', sub:[
    ['sc-check','8.1 安全基线核查'],['sc-audit','8.2 审计日志'],['sc-secret','8.3 密钥与配置'],['sc-db','8.4 数据库防护']]},
  {id:'sandbox', icon:'🧱', t:'9. 沙箱隔离', sub:[
    ['sb-view','9.1 隔离视图'],['sb-rules','9.2 隔离规则']]},
  {id:'system', icon:'⚙️', t:'10. 系统与部署', sub:[
    ['sy-status','10.1 容器状态'],['sy-deploy','10.2 一键部署'],
    ['sy-backup','10.3 备份与恢复'],['sy-cap','10.4 压测与容量报告']]},
];
function buildNav(){
  document.getElementById('nav').innerHTML = MENU.map((g,i)=>`
    <div class="grp ${i===0?'open':''}" data-g="${g.id}">
      <div class="t" onclick="this.parentNode.classList.toggle('open')">
        <span class="ic">${g.icon}</span><span>${g.t}</span><span class="ar">▶</span></div>
      <div class="sub">${g.sub.map(([id,t])=>`<button data-id="${id}" onclick="openMenu('${g.id}','${id}')">${t}</button>`).join('')}</div>
    </div>`).join('');
}
function openMenu(gid, id){
  document.querySelectorAll('.grp .sub button').forEach(b=>b.classList.toggle('on', b.dataset.id===id));
  const g = MENU.find(x=>x.id===gid); if(g){ const el=document.querySelector(`[data-g="${gid}"]`); if(el) el.classList.add('open'); }
  render(id);
}

// ---- 各页面渲染 ----
async function render(id){
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">加载中…</div>';
  try{
    if(id.startsWith('ov-')) return await renderOverview(id,v);
    if(id==='tk-list') return await renderSessions(v);
    if(id==='tk-chain'||id==='tk-flow'||id==='tk-replay') return await renderChain(v,id);
    if(id==='dg-one'||id==='dg-resume'||id==='dg-inject') return await renderDiag(v,id);
    if(id.startsWith('er-')) return await renderErrors(v,id);
    if(id.startsWith('ev-')) return await renderEvents(v,id);
    if(id.startsWith('ag-')) return await renderAgents(v,id);
    if(id.startsWith('ct-')) return await renderCatalog(v,id);
    if(id.startsWith('kb-')) return await renderKb(v,id);
    if(id.startsWith('sc-')) return await renderSecurity(v,id);
    if(id.startsWith('sb-')) return await renderSandbox(v,id);
    if(id.startsWith('sy-')) return await renderSystem(v,id);
  }catch(e){ v.innerHTML = `<div class="note err">加载失败：${esc(e.message)}</div>`; }
}

function head(t,h){ return `<div class="card"><h2>${esc(t)}</h2><p class="hint">${esc(h)}</p>`; }

async function renderOverview(id,v){
  const d = await api('overview');
  if(id==='ov-health'){
    v.innerHTML = head('0.1 平台健康总览','平台与后台共享同一数据源，以下计数来自实时查询')+
      `<div class="kpis">
        <div class="kpi"><b>${d.sessions}</b><span>会话总数</span></div>
        <div class="kpi"><b>${d.tasks}</b><span>子任务</span></div>
        <div class="kpi"><b>${d.snapshots}</b><span>上下文快照</span></div>
        <div class="kpi"><b>${d.logs}</b><span>结构化日志</span></div>
        <div class="kpi"><b>${d.chat_turns}</b><span>对话轮次</span></div>
        <div class="kpi"><b>${d.events}</b><span>实时事件</span></div>
        <div class="kpi"><b>${d.incidents_open}</b><span>待处置事故</span></div>
        <div class="kpi"><b>${d.capabilities.tools}/${d.capabilities.skills}</b><span>工具 / 技能</span></div>
      </div></div>`+
      `<div class="card"><h2>会话状态分布</h2>${tbl(['状态','数量'],(d.by_status||[]).map(r=>[tag(r.status),esc(r.n)]))}</div>`;
  } else if(id==='ov-metrics'){
    const p=d.performance;
    v.innerHTML = head('0.2 实时指标','耗时取自 chat.done 事件的真实测量值，非估算')+
      `<div class="kpis">
        <div class="kpi"><b>${p.avg_duration_ms}<small> ms</small></b><span>平均任务耗时</span></div>
        <div class="kpi"><b>${p.p95_duration_ms==null?'-':p.p95_duration_ms}<small> ms</small></b><span>P95 耗时</span></div>
        <div class="kpi"><b>${p.samples}</b><span>采样轮次</span></div>
        <div class="kpi"><b>${d.tasks?Math.round(100*d.tasks_done/d.tasks):0}%</b><span>子任务完成率</span></div>
        <div class="kpi"><b>${d.incidents}</b><span>累计事故</span></div>
        <div class="kpi"><b>${d.service.uptime_seconds}s</b><span>后台运行时长</span></div>
      </div></div>`+
      `<div class="note">当前为单机 SQLite + WAL 部署。支撑「上百人」已具备基础（多进程读、写入串行化）；
      「上千人同时高强度写入」需切换 PostgreSQL 并水平扩容，压测结论见 10.4，不做超出实测的承诺。</div>`;
  } else if(id==='ov-sync'){
    const c=d.consistency;
    v.innerHTML = head('0.3 数据同步状态','直接回答「前端跑完任务、后台看不看得见」')+
      `<div class="note"><b>${esc(c.conclusion)}</b></div>`+
      `<div class="kv">
        <div><b>单一数据源</b>：${c.single_source_of_truth?'是':'否'}</div>
        <div><b>共享数据库</b>：${c.shared_database?'是':'否'}</div>
        <div><b>前端用户轮次</b>：${c.frontend_turns_vs_backend_records.frontend_user_turns}</div>
        <div><b>后台已存轮次</b>：${c.frontend_turns_vs_backend_records.backend_stored_turns}</div>
        <div><b>每轮均有后台记录</b>：${c.frontend_turns_vs_backend_records.each_frontend_turn_has_backend_record?'✅ 是':'❌ 否'}</div>
        <div><b>事件总数</b>：${c.events.total}</div>
        <div><b>会话 / 任务 / 快照</b>：${c.sessions} / ${c.tasks} / ${c.snapshots}</div>
        <div><b>核验时间</b>：${esc(fmtTime(c.verified_at))}</div>
      </div></div>`;
  } else {
    v.innerHTML = head('0.4 服务拓扑','三个服务独立，数据库仅挂内部卷')+
      tbl(['服务','角色','地址'],(d.topology||[]).map(t=>[esc(t.service),esc(t.role),`<span class="mono">${esc(t.url)}</span>`]));
  }
}

async function renderSessions(v){
  const d = await api('sessions?limit=200');
  window._sessions=d.sessions;
  v.innerHTML = head('1.1 会话列表','点击「详情」查看该会话的完整执行链')+
    `<div class="bar">
      <select id="f-ch" onchange="filterSessions()"><option value="">全部通道</option><option value="chat">对话 chat</option><option value="work">办公 work</option></select>
      <select id="f-owner" onchange="filterSessions()"><option value="">全部归属</option>
        ${[...new Set(d.sessions.map(s=>s.owner))].map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>
      <button class="btn" onclick="render('tk-list')">刷新</button>
    </div><div id="sess-tbl"></div></div>`;
  filterSessions();
}
function filterSessions(){
  const ch=document.getElementById('f-ch').value, ow=document.getElementById('f-owner').value;
  const rows=window._sessions.filter(s=>(!ch||s.channel===ch)&&(!ow||s.owner===ow));
  document.getElementById('sess-tbl').innerHTML = tbl(
    ['会话 ID','通道','归属','状态','步数','最近活动','操作'],
    rows.map(s=>[`<span class="mono">${esc(String(s.session_id).slice(0,18))}</span>`,tag(s.channel),
      esc(s.owner),tag(s.status),esc(s.step_index??'-'),esc(fmtTime(s.updated_at)),
      `<button class="btn" onclick="pickSession('${esc(s.session_id)}')">详情</button>`]));
}
function pickSession(sid){ window._sid=sid; openMenu('tasks','tk-chain'); }

async function renderChain(v,id){
  const sid = window._sid || ((await api('sessions?limit=1')).sessions[0]||{}).session_id;
  const bar = `<div class="bar"><label>会话</label><select id="sel-sid" onchange="window._sid=this.value;render('${id}')" style="min-width:300px">
    ${window._sessions?window._sessions.map(s=>`<option value="${esc(s.session_id)}" ${s.session_id===sid?'selected':''}>${esc(String(s.session_id).slice(0,24))} · ${esc(s.channel)} · ${esc(s.status)}</option>`).join(''):''}
    </select><button class="btn" onclick="render('${id}')">刷新</button></div>`;
  if(!sid){ v.innerHTML=head('任务执行链','')+'<div class="empty">暂无会话，请先在智能体平台执行一个任务</div></div>'; return; }
  window._sid=sid;
  const d = await api('sessions/'+encodeURIComponent(sid));
  if(!d.found){ v.innerHTML='<div class="empty">会话不存在</div>'; return; }
  if(id==='tk-chain'){
    v.innerHTML = head('1.2 任务执行链','两级分派：子任务 → 作业，含 assignee 与状态')+bar+`</div>`+
      `<div class="card"><h2>子任务</h2>${tbl(['任务','标题','执行者','状态','重试'],d.tasks.map(t=>[

    const i=d.incident;

      数据库仅挂载到内部卷、不对公网暴露端口。</div>`;
  } else if(id==='sy-backup'){
    v.innerHTML=head('10.3 备份与恢复','SQLite 官方 backup API，WAL 状态下一致性快照')+
      `<div class="bar"><button class="btn primary" onclick="doBackup()">立即备份</button></div><div id="bk-out"></div>`+
      `<div class="card"><h2>已有备份（${d.backups.length}）</h2>${tbl(['文件','大小','时间'],d.backups.map(b=>[
        `<span class="mono">${esc(b.name)}</span>`,esc(b.size+' B'),esc(b.created_at)]))}</div>`;
  } else {
    v.innerHTML=head('10.4 压测与容量报告','如实标注已验证与未验证范围')+
      `<div class="card"><pre>部署形态：platform + admin 双进程，共享 SQLite(WAL) 数据库
读路径：多进程并发读，WAL 不阻塞
写路径：单写者串行化（SQLite 限制）
已具备：上百人量级的日常使用基础 + 健康检查 + 自动重启 + 一致性备份
需扩展：上千人同时高强度写入 → 切换 PostgreSQL（schema 已备）+ 连接池 + 水平扩容
未承诺：未在千并发压测环境下验证，不宣称「上千人不卡顿」已达标</pre></div>`+
      `<div class="note">容量结论以实测为准。若需支撑千并发，请启用 docker-compose 的
      postgres profile 并设置 AP_DB_DSN，再执行压测脚本取得真实指标。</div>`;
  }
}
async function doBackup(){
  try{ const d=await api('backup',{method:'POST'});
    document.getElementById('bk-out').innerHTML=`<div class="note ${d.ok?'':'err'}">${esc(JSON.stringify(d))}</div>`;
  }catch(e){ document.getElementById('bk-out').innerHTML=`<div class="note err">${esc(e.message)}（需超管令牌）</div>`; }
}

// ---- SSE 实时事件流 ----
let es=null;
function startStream(){
  if(es) es.close();
  const url=API('stream')+'?token='+encodeURIComponent(TOKEN);
  es=new EventSource(url);
  const live=document.getElementById('live');
  es.onopen=()=>{ live.classList.add('on'); live.querySelector('span').textContent='实时已连接'; };
  es.onerror=()=>{ live.classList.remove('on'); live.querySelector('span').textContent='重连中…'; };
  es.onmessage=(ev)=>{
    try{
      const d=JSON.parse(ev.data);
      window._feed=window._feed||[];
      window._feed.unshift(d); if(window._feed.length>300) window._feed.pop();
      const feed=document.getElementById('feed');
      if(feed){
        const row=document.createElement('div'); row.className='row';
        row.innerHTML=`<span class="t">${esc(fmtTime(d.created_at))}</span>
          <span class="k">${esc(d.kind)}</span><span class="s">${esc(d.summary||'')}
          ${d.status?` · ${esc(d.status)}`:''}${d.duration_ms!=null?` · ${d.duration_ms}ms`:''}</span>`;
        feed.insertBefore(row, feed.firstChild);
        while(feed.childNodes.length>120) feed.removeChild(feed.lastChild);
      }
    }catch(e){}
  };
}
